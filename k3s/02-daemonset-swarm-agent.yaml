apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: swarm-agent
  namespace: swarm-system
spec:
  selector:
    matchLabels:
      app: swarm-agent
  template:
    metadata:
      labels:
        app: swarm-agent
    spec:
      serviceAccountName: swarm-agent
      containers:
      - name: swarm-agent
        #image: zewang42/swarm-agent-7.0:amd
        image: ghcr.io/swarmchestrate/swarm-agent:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_ROLE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['role']
        - name: MON_CLIENT_STOMP_HOST
          value: "emsserver-ems-server.swarm-system"
        - name: SA_RECONF_MODE
          value: "auto"
        # replayed metric values, present only when deploy-sa.sh was given SIM_METRICS
        - name: SA_SIM_METRICS_FILE
          value: "/simdata/metrics.json"
        # metric values log at DEBUG; set to DEBUG to see them
        - name: SA_LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tosca
          mountPath: /tosca
        - name: simdata
          mountPath: /simdata
      volumes:
      - name: config
        configMap:
          name: swarm-agent-config
      - name: tosca
        configMap:
          name: swarm-agent-tosca
      - name: simdata
        configMap:
          name: swarm-agent-simdata
          optional: true

